current:
  version: "0.7.0"
  status: complete
  released: "2026-11-22"
  title: "Strategies that spread"
  note: "Released. spread.yaml (how many must cooperate first) and ecology.yaml (the nine strategies with mistakes as a population), with Forge 10.0.0-rc.33's dynamics: key; every figure is a Forge result pinned in scripts/check_models.py. Also the hidden-type games once planned as v0.6.3. v0.6.0: the five-player public goods game. v0.5.0's games are in CHANGELOG.md and docs/MORE_GAMES.md."
  deliverables:
    - "Replicator dynamics: strategy shares changing by generation, beside predator_prey.yaml (spread.yaml, ecology.yaml)"
    - "Hidden types: hidden_types.yaml and signalling.yaml"
    - "Monte Carlo over a game: models/analytics/spread_monte_carlo.yaml asks how likely cooperation is to spread when w, c and the starting share are uncertain (forge simulate over a game with dynamics:); it runs 600 generations, since a start near x* leaves it slowly and 60 is too short"

# Planned. Needs a decision before it starts: how Forge checks expected values per scenario.
next:
  version: "0.8.0"
  title: "Forge only"
  status: planned
  why: "The models are there to show what Forge can do, and the CI check that pins their figures is a Python script (scripts/check_models.py, the only Python in the repo). Forge validates a model's stored values but only for the base case: forge validate takes no --scenario, and most of the figures live in scenarios."
  deliverables:
    - "Every check runs through Forge (and plain shell): no .py file in the repo, scripts/check_models.py gone"
    - "Expected figures live beside the model they belong to, not in a script"
  routes:
    - "A Forge change: forge validate checks the stored results of each scenario (an ADR in Forge first; Forge's rules apply: 100% coverage, pedantic clippy)"
    - "No Forge change: committed golden output (forge compare --format csv, forge calculate) that CI diffs with plain shell; weaker, since a golden file is regenerated, not stated"
  blocked_by:
    - "forge bayesian reads literal numbers only (a formula in a prior or a cpt is refused: 'invalid type: string, expected f64') and takes no --scenario. mistake_or_defection.yaml's nine settings of the prior and the noise are therefore checked by a Python script that rewrites the network and compares forge bayesian with Bayes' rule in exact fractions. A Forge formula can give Bayes' rule by hand for each setting, but nothing then checks the network engine at those settings. Either Forge's networks take scalars and scenarios (a Forge change), or the check is reduced to the base network plus a formula table."
  acceptance: "CI's check job runs only forge and shell; breaking a value in any model fails it, as it does today; every figure the docs quote is still pinned"

