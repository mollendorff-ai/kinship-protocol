  - "Reputation over repeated play: hidden types in a repeated game (Kreps, Milgrom, Roberts and Wilson, 1982). v0.7.0 has the one-shot games (hidden_types.yaml, signalling.yaml); the repeated ones need repeated games with hidden types in Forge"
  - "Put the Grok and Copilot transcripts in the repo so the cross-AI table can be checked"
  - "KL divergence / FEP formalization (only if a rigorous mapping is found)"
  - "A two-variable table of w* (cost of conflict by temptation) with forge sensitivity, hand-checked"
  - "Stability of mixed equilibria (Forge's <game>.equilibrium_<k>.stable): only spread.yaml shows it. Say in stag_hunt.yaml, chicken.yaml and inspection.yaml whether a population returns to the mix, and what that means for cooperation"
