# Möllendorff AI Asimov Roadmap
#
# WHAT to build - milestones only
#
# See: CHANGELOG.md for completed work and findings
# See: research/THESIS.md for core hypothesis
# See: README.md for project overview

current:
  version: "0.8.0"
  status: complete
  released: "2026-11-23"
  title: "Forge only"
  note: "Released. Every check of the models runs through Forge 10.0.0-rc.35 (expect: is its ADR-074, from rc.34; rc.35 needs every formula's result stored): each model states the figures it must give under expect:, in the file as written and in each scenario, and forge validate compares them. mistake_or_defection.yaml is one file with the nine settings as scenarios and a network that reads the model. CI's check job runs only forge and shell (forge validate on every model, the seeded analyses and the docs' quotes as grep -F); scripts/check_models.py and the pip install are gone. v0.7.0: strategies that spread (spread.yaml, ecology.yaml, hidden types). v0.6.0: the five-player public goods game. v0.5.0's games are in CHANGELOG.md and docs/MORE_GAMES.md."
  deliverables:
    - "Every check runs through Forge (and plain shell): no .py file in the repo, scripts/check_models.py gone"
    - "Expected figures live beside the model they belong to, under expect: (252 figures of the ten game models, 41 of stag hunt, chicken and Axelrod, the flip points of continuation.yaml as scenarios)"
    - "mistake_or_defection.yaml: nine settings of the prior and the noise as scenarios of one file, with named queries, Bayes' rule by hand and a takes formula, all pinned"
    - "short_horizon.yaml and analytics/five_ais_bootstrap.yaml store Forge's values and pass forge validate"
    - "The 11 seeded analysis figures and the 37 quotes of the docs are grep -F lines in .github/workflows/models.yml"
  acceptance: "CI's check job runs only forge and shell; breaking a value in any model fails it; every figure the docs quote is still pinned"
  not_covered: "The two Monte Carlo models (analytics/cooperation_monte_carlo.yaml, spread_monte_carlo.yaml) have MC.* inputs, which forge validate cannot calculate; their figures are grep -F lines on forge simulate's report"

# Ideas, not plans. Nobody is working on these. Pull requests welcome.
