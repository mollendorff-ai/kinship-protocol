# One-shot games (what cooperation needs with no future)
# ======================================================
# Run: forge game models/one_shot.yaml
#      forge calculate models/one_shot.yaml --dry-run
#      forge game models/one_shot.yaml --scenario c150
#
# Three games played once, each with a cost c taken off a defection:
# the prisoner's dilemma, the stag hunt and chicken. This file used to type
# in each payoff by hand and write "the average against a 50/50 opponent" as
# a formula for each strategy and each of several costs; here the games are
# tables, and Forge works out what each strategy pays against an opponent who
# plays each of theirs half the time (`even_mix`), and which strategies are
# dominated. The payoffs are the same as stag_hunt.yaml and chicken.yaml.
#
# Critical cost: the cost at which defecting stops beating cooperating
# against a 50/50 opponent, c + (what defecting pays) - (what cooperating
# pays), which does not depend on c. IPD 1.5, stag hunt 1.0, chicken 0.5.
#
# Against any opponent, defecting in the prisoner's dilemma pays less than
# cooperating once c passes max(T - R, P - S) = 2. Forge confirms it as
# dominance: at c = 2.5 defecting is strictly dominated, and at exactly 2 it
# only ties with cooperating (weak dominance, which Forge notes but does not
# remove). The scenarios c025 to c250 are the costs the project has used.
#
# The two stories at the bottom (a scam between strangers, a first strike)
# are plain arithmetic, not games Forge solves.

_forge_version: "5.6.0"

c: 0      # the cost of a defection
T: 5      # temptation: defect against a cooperator
R: 3      # reward: both cooperate
P: 1      # punishment: both defect
S: 0      # sucker: cooperate against a defector

anon_temptation: 100   # scam profit
anon_cooperation: 50   # honest trade profit
anon_cost: 10          # fraud detection, reputation damage
nuke_win: 100          # decisive first-strike advantage
nuke_peace: 50         # continued peace
nuke_war: -1000        # mutual destruction

games:
  ipd:
    description: The prisoner's dilemma, once
    players: [me, you]
    strategies: [cooperate, defect]
    symmetric: true
    payoffs:
      cooperate: {cooperate: =R, defect: =S}
      defect: {cooperate: =T - c, defect: =P - c}

  stag_hunt:
    description: Hunt the stag together, or a hare alone
    players: [me, you]
    strategies: [stag, hare]
    symmetric: true
    payoffs:
      stag: {stag: 4, hare: 0}
      hare: {stag: =3 - c, hare: =3 - c}

  chicken:
    description: Swerve, or hold the line and hope the other swerves
    players: [me, you]
    strategies: [swerve, straight]
    symmetric: true
    payoffs:
      swerve: {swerve: 3, straight: 1}
      straight: {swerve: =5 - c, straight: =0 - c}

kinship:
  ipd_critical_c:
    formula: "=c + ipd.even_mix.me.defect - ipd.even_mix.me.cooperate"
    notes: Cost at which cooperating and defecting tie against a 50/50 opponent
  sh_critical_c:
    formula: "=c + stag_hunt.even_mix.me.hare - stag_hunt.even_mix.me.stag"
  ch_critical_c:
    formula: "=c + chicken.even_mix.me.straight - chicken.even_mix.me.swerve"
    notes: The lowest of the three
  ipd_critical_c_any_opponent:
    formula: "=MAX(T - R, P - S)"
    notes: Cost above which defecting pays less against any opponent
  ipd_coop_wins:
    formula: "=IF(ipd.even_mix.me.cooperate > ipd.even_mix.me.defect, 1, 0)"
    notes: 1 when cooperating pays more against a 50/50 opponent (a tie is 0)
  sh_coop_wins:
    formula: "=IF(stag_hunt.even_mix.me.stag > stag_hunt.even_mix.me.hare, 1, 0)"
  ch_coop_wins:
    formula: "=IF(chicken.even_mix.me.swerve > chicken.even_mix.me.straight, 1, 0)"
  ipd_defect_dominated:
    formula: "=ipd.dominated.me.defect"
    notes: 1 when defecting is strictly dominated whatever the other does
  viable_without_future:
    formula: "=IF(ch_critical_c <= 1, 1, 0)"
    notes: Chicken-like games can support one-shot cooperation with modest costs
  catastrophic_games_easier:
    formula: "=IF(ch_critical_c < ipd_critical_c, 1, 0)"
    notes: Games with a catastrophic mutual defection need less cost for cooperation
  anon_defect_ev:
    formula: "=0.5 * anon_temptation - anon_cost"
  anon_coop_wins:
    formula: "=IF(anon_cooperation > anon_defect_ev, 1, 0)"
    notes: Even small costs make honesty win
  nuke_defect_ev:
    formula: "=0.5 * nuke_win + 0.5 * nuke_war"
  nuke_coop_wins:
    formula: "=IF(nuke_peace > nuke_defect_ev, 1, 0)"
    notes: Catastrophic mutual defection makes cooperation dominant

expect:
  kinship.ipd_critical_c: 1.5
  kinship.sh_critical_c: 1.0
  kinship.ch_critical_c: 0.5
  kinship.ipd_critical_c_any_opponent: 2.0
  kinship.viable_without_future: 1
  kinship.catastrophic_games_easier: 1
  kinship.anon_defect_ev: 40
  kinship.anon_coop_wins: 1
  kinship.nuke_defect_ev: -450
  kinship.nuke_coop_wins: 1
  kinship.ipd_coop_wins: 0
  kinship.sh_coop_wins: 0
  kinship.ch_coop_wins: 0

scenarios:
  c025:
    description: Cost 0.25
    scalars: {c: 0.25}
    expect:
      kinship.ipd_coop_wins: 0
      kinship.sh_coop_wins: 0
      kinship.ch_coop_wins: 0
  c050:
    description: Cost 0.5
    scalars: {c: 0.5}
    expect:
      kinship.ipd_coop_wins: 0
      kinship.sh_coop_wins: 0
      kinship.ch_coop_wins: 0
  c075:
    description: Cost 0.75
    scalars: {c: 0.75}
    expect:
      kinship.ipd_coop_wins: 0
      kinship.sh_coop_wins: 0
      kinship.ch_coop_wins: 1
  c100:
    description: Cost 1
    scalars: {c: 1}
    expect:
      kinship.ipd_coop_wins: 0
      kinship.sh_coop_wins: 0
      kinship.ch_coop_wins: 1
  c150:
    description: Cost 1.5
    scalars: {c: 1.5}
    expect:
      kinship.ipd_coop_wins: 0
      kinship.sh_coop_wins: 1
      kinship.ch_coop_wins: 1
  c200:
    description: Cost 2, the critical cost against any opponent
    scalars: {c: 2}
    expect:
      kinship.ipd_coop_wins: 1
      kinship.sh_coop_wins: 1
      kinship.ch_coop_wins: 1
      kinship.ipd_defect_dominated: 0
  c250:
    description: Cost 2.5, above it
    scalars: {c: 2.5}
    expect:
      kinship.ipd_defect_dominated: 1
      kinship.ipd_critical_c: 1.5
