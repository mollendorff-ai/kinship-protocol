# When Cooperation Holds
# ======================
# Run: forge game models/continuation.yaml
#      forge game models/continuation.yaml --scenario costly
#
# The threshold the project derives by formula, w* = (T - c - R) / (T - P),
# here checked by playing it. A match ends at random: after each round it
# goes on with the chance w. Against GrimTrigger, AlwaysDefect gets T - c
# once and then P - c for good, an average of (1 - w)(T - c) + w (P - c) a
# round; GrimTrigger gets R against itself. GrimTrigger is collectively
# stable (nothing in the roster does better against it than it does against
# itself) exactly when w >= w*.
#
# With the Axelrod payoffs and no cost, w* = 0.5: at w = 0.4 AlwaysDefect
# beats GrimTrigger at its own game (3.4 a round against 3), at 0.5 they
# tie and GrimTrigger holds. A cost of conflict of 0.5 lowers w* to 0.375
# (the corrected figure in docs/COOPERATION_THRESHOLDS.md), and at w = 0.4
# GrimTrigger now holds.
#
# Adapted from Forge's examples/games/continuation.yaml.

_forge_version: "5.6.0"

w: 0.6    # the chance that a match goes on after a round
c: 0      # the cost of a defection
dilemma_payoffs:
  T: 5    # temptation: defect against a cooperator
  R: 3    # reward: both cooperate
  P: 1    # punishment: both defect
  S: 0    # sucker: cooperate against a defector

games:
  dilemma:
    description: The prisoner's dilemma, one round
    players: [me, you]
    strategies: [cooperate, defect]   # a tournament reads the first as cooperate
    symmetric: true
    payoffs:
      cooperate: {cooperate: =R, defect: =S}
      defect: {cooperate: =T - c, defect: =P - c}

  long_run:
    description: Matches that end at random, going on with the chance w
    tournament:
      round: dilemma
      players:
        grim: grim_trigger
        tft: tit_for_tat
        ad: always_defect
      continuation: =w
      self_play: true

kinship:
  threshold:
    formula: "=(T - c - R) / (T - P)"
    value: 0.5
    notes: The w from which GrimTrigger is stable against AlwaysDefect (w*)
  grim_holds:
    formula: "=long_run.stable.grim"
    value: 1
    notes: 1 when nothing in the roster does better against GrimTrigger than GrimTrigger does
  agrees:
    formula: "=IF(grim_holds = IF(w >= threshold, 1, 0), 1, 0)"
    value: 1
    notes: 1 when the tournament and the formula say the same thing
  defector_edge:
    formula: "=long_run.match.ad.grim - long_run.match.grim.grim"
    value: -0.4
    notes: How much more AlwaysDefect gets against GrimTrigger than GrimTrigger gets against itself

expect:
  kinship.threshold: 0.5
  kinship.grim_holds: 1
  kinship.agrees: 1
  long_run.match.ad.grim: 2.6

scenarios:
  short:
    description: Below the threshold
    scalars: {w: 0.4}
    expect:
      kinship.threshold: 0.5
      kinship.grim_holds: 0
      kinship.agrees: 1
      long_run.match.ad.grim: 3.4
  edge:
    description: At the threshold, where defecting and cooperating tie
    scalars: {w: 0.5}
    expect:
      kinship.grim_holds: 1
      kinship.agrees: 1
      long_run.match.ad.grim: 3
  costly:
    description: The same short horizon with a cost of conflict of 0.5 (w* = 0.375)
    scalars: {w: 0.4, c: 0.5}
    expect:
      kinship.threshold: 0.375
      kinship.grim_holds: 1
      kinship.agrees: 1
      long_run.match.ad.grim: 2.9

  # The flip point: at the w where w* = (T - c - R) / (T - P) says AlwaysDefect
  # stops beating GrimTrigger, the edge is nil. The three costs the old
  # goal-seek check used, each at its own w*; at c = 0 it is the edge above.
  flip_free:
    description: w* at no cost of conflict (0.5); AlwaysDefect has no edge over GrimTrigger
    scalars: {w: 0.5, c: 0}
    expect:
      kinship.defector_edge: 0
      kinship.threshold: 0.5
  flip_costly:
    description: w* at a cost of conflict of 0.5 (0.375)
    scalars: {w: 0.375, c: 0.5}
    expect:
      kinship.defector_edge: 0
      kinship.threshold: 0.375
  flip_ruinous:
    description: w* at a cost of conflict of 1 (0.25)
    scalars: {w: 0.25, c: 1}
    expect:
      kinship.defector_edge: 0
      kinship.threshold: 0.25
