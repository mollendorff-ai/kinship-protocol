# Check that every Forge model still runs and that no stored value has drifted
# from its formula, and that the figures quoted in the README and docs still
# match what Forge computes. Runs on its own for every push and pull request
# that touches the models or the prose that quotes them; nothing to start by hand.
name: Check models

on:
  push:
    branches: [main]
    paths:
      - 'models/**'
      - 'README.md'
      - 'docs/**'
      - 'scripts/check_models.py'
      - '.github/workflows/models.yml'
  pull_request:
    paths:
      - 'models/**'
      - 'README.md'
      - 'docs/**'
      - 'scripts/check_models.py'
      - '.github/workflows/models.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_VERSION: v10.0.0-rc.27

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The release binary, checked against the release's checksums (a few
      # seconds, no compiler). The installer is read from the same tag.
      - name: Install Forge
        run: |
          curl -fsSL "https://raw.githubusercontent.com/mollendorff-ai/forge/${FORGE_VERSION}/install.sh" | FORGE_VERSION="$FORGE_VERSION" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Check models
        run: python3 scripts/check_models.py
